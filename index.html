<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 골드 캡슐머신 경품 추첨 System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8f6f0;
    }
    
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    /* responsive grid layout */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 p-4 md:p-8">

  <!-- Header Section -->
  <header class="text-center max-w-4xl mx-auto mb-8">
    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-amber-100/80 text-amber-800 text-xs font-semibold mb-3 border border-amber-200/60">
      <i class="fa-solid fa-sparkles text-amber-600"></i>
      <span>사회복지기관 전용 3D 캡슐 경품 추첨 시스템</span>
    </div>
    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 tracking-tight mb-2">
      3D 골드 캡슐머신 경품 추첨
    </h1>
    <p class="text-sm md:text-base text-gray-500">
      참가 번호와 경품을 설정하고, 원하는 경품별로 순서대로 공정하게 추첨하세요.
    </p>
  </header>

  <!-- Main Content Area (2 Columns) -->
  <main class="max-w-6xl mx-auto admin-grid">
    
    <!-- LEFT: 참가 번호 범위 설정 (초록색 박스칸 영역) -->
    <section class="bg-white rounded-2xl p-6 card-shadow border border-amber-100/50">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center font-bold text-lg border border-amber-200/50">
          #
        </div>
        <div>
          <h2 class="text-lg font-bold text-gray-800">참가 번호 범위 설정</h2>
          <p class="text-xs text-gray-400">시작과 마지막 번호를 입력하세요</p>
        </div>
      </div>

      <div class="space-y-5">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">시작 번호</label>
            <input 
              type="number" 
              id="startNum" 
              value="1" 
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-amber-400 text-center"
            >
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-1">마지막 번호</label>
            <input 
              type="number" 
              id="endNum" 
              value="170" 
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-amber-400 text-center"
            >
          </div>
        </div>

        <!-- 참가자 범위 요약 박스 (초록색) -->
        <div id="participantSummary" class="p-3.5 bg-emerald-50/80 border border-emerald-200 rounded-xl text-emerald-700 font-bold text-sm text-center">
          1번 ~ 170번 (총 170명)
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">행사 제목</label>
          <input 
            type="text" 
            id="eventTitle" 
            value="2026 복지관 송년 후원자의 밤 경품 추첨" 
            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm"
          >
        </div>

        <button 
          id="resetBtn" 
          class="w-full py-2.5 px-4 bg-white hover:bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium text-blue-600 flex items-center justify-center gap-1.5 transition-colors"
        >
          <i class="fa-solid fa-rotate-left"></i>
          <span>기본 예시값(1~170번)으로 재설정</span>
        </button>
      </div>
    </section>

    <!-- RIGHT: 경품 목록 관리 (빨간 박스칸 영역) -->
    <section class="bg-white rounded-2xl p-6 card-shadow border border-amber-100/50">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl">
            🎁
          </div>
          <div>
            <h2 class="text-lg font-bold text-gray-800">경품 목록 관리</h2>
            <p class="text-xs text-gray-400">원하는 경품을 바로 골라 추첨할 수 있습니다</p>
          </div>
        </div>
        <span id="totalPrizeCount" class="px-2.5 py-1 bg-amber-50 text-amber-700 text-xs font-bold rounded-full border border-amber-200">
          총 14개
        </span>
      </div>

      <!-- Add Prize Form -->
      <div class="flex gap-2 mb-5">
        <input 
          type="text" 
          id="newPrizeName" 
          placeholder="새 경품 이름 (예: 한우 세트)" 
          class="flex-1 min-w-0 px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-400"
        >
        <input 
          type="number" 
          id="newPrizeQty" 
          value="1" 
          min="1" 
          class="w-16 px-2 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-center font-bold focus:outline-none focus:ring-2 focus:ring-amber-400 shrink-0"
        >
        <button 
          id="addPrizeBtn" 
          class="px-4 py-2.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white font-bold text-sm rounded-xl shadow-sm transition-all shrink-0 flex items-center gap-1"
        >
          <span>+ 추가</span>
        </button>
      </div>

      <!-- Prize Item List -->
      <div id="prizeList" class="space-y-2.5 max-h-[460px] overflow-y-auto pr-1">
        
        <!-- Item 1 -->
        <div class="flex items-center justify-between p-3 bg-amber-50/40 border border-amber-100/80 rounded-xl gap-2">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <span class="w-6 h-6 rounded-lg bg-amber-100 text-amber-800 text-xs font-bold flex items-center justify-center shrink-0">1</span>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-bold text-gray-800 truncate" title="1등 스마트워치">1등 스마트워치</div>
              <div class="text-[11px] text-emerald-600 font-semibold">(1/1 추첨완료)</div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs text-gray-500 font-medium">수량: <span class="font-bold text-gray-700">1</span></span>
            <button class="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-1 transition-all shrink-0">
              <i class="fa-solid fa-play text-[10px]"></i> 추첨
            </button>
            <button class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-500 text-xs font-semibold rounded-lg border border-rose-200/60 transition-colors shrink-0">
              삭제
            </button>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="flex items-center justify-between p-3 bg-white border border-gray-100 rounded-xl gap-2 hover:border-amber-200 transition-colors">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <span class="w-6 h-6 rounded-lg bg-gray-100 text-gray-600 text-xs font-bold flex items-center justify-center shrink-0">2</span>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-bold text-gray-800 truncate" title="2등 무선이어폰">2등 무선이어폰</div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs text-gray-500 font-medium">수량: <span class="font-bold text-gray-700">2</span></span>
            <button class="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-1 transition-all shrink-0">
              <i class="fa-solid fa-play text-[10px]"></i> 추첨
            </button>
            <button class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-500 text-xs font-semibold rounded-lg border border-rose-200/60 transition-colors shrink-0">
              삭제
            </button>
          </div>
        </div>

        <!-- Item 3 -->
        <div class="flex items-center justify-between p-3 bg-white border border-gray-100 rounded-xl gap-2 hover:border-amber-200 transition-colors">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <span class="w-6 h-6 rounded-lg bg-gray-100 text-gray-600 text-xs font-bold flex items-center justify-center shrink-0">3</span>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-bold text-gray-800 truncate" title="행운상 치킨 교환권">행운상 치킨 교환권</div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs text-gray-500 font-medium">수량: <span class="font-bold text-gray-700">10</span></span>
            <button class="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-1 transition-all shrink-0">
              <i class="fa-solid fa-play text-[10px]"></i> 추첨
            </button>
            <button class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-500 text-xs font-semibold rounded-lg border border-rose-200/60 transition-colors shrink-0">
              삭제
            </button>
          </div>
        </div>

        <!-- Item 4 (Long Text Example) -->
        <div class="flex items-center justify-between p-3 bg-white border border-gray-100 rounded-xl gap-2 hover:border-amber-200 transition-colors">
          <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <span class="w-6 h-6 rounded-lg bg-gray-100 text-gray-600 text-xs font-bold flex items-center justify-center shrink-0">4</span>
            <div class="min-w-0 flex-1">
              <div class="text-sm font-bold text-gray-800 truncate" title="한우소고기 세트 현대백화점 상품권 10만원권">한우소고기 세트 현대백...</div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs text-gray-500 font-medium">수량: <span class="font-bold text-gray-700">1</span></span>
            <button class="px-3 py-1.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white text-xs font-bold rounded-lg shadow-sm flex items-center gap-1 transition-all shrink-0">
              <i class="fa-solid fa-play text-[10px]"></i> 추첨
            </button>
            <button class="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-500 text-xs font-semibold rounded-lg border border-rose-200/60 transition-colors shrink-0">
              삭제
            </button>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script>
    // 입력값 변경 시 실시간 참가 번호 요약 업데이트
    const startInput = document.getElementById('startNum');
    const endInput = document.getElementById('endNum');
    const summary = document.getElementById('participantSummary');

    function updateSummary() {
      const start = parseInt(startInput.value) || 0;
      const end = parseInt(endInput.value) || 0;
      const total = end >= start ? (end - start + 1) : 0;
      summary.textContent = `${start}번 ~ ${end}번 (총 ${total}명)`;
    }

    startInput.addEventListener('input', updateSummary);
    endInput.addEventListener('input', updateSummary);

    // 기본값 재설정
    document.getElementById('resetBtn').addEventListener('click', () => {
      startInput.value = 1;
      endInput.value = 170;
      updateSummary();
    });
  </script>
</body>
</html>
